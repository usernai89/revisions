# Publie automatiquement l'appli sur GitHub Pages
# à chaque modification de la branche "main".
# (Réglage à faire une fois : Settings → Pages → Source : "GitHub Actions")
name: Publication GitHub Pages

on:
  push:
    branches: [main]
  pull_request: # sur une demande de fusion : on vérifie seulement (tests + construction)
  workflow_dispatch: # permet aussi de lancer la publication à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
